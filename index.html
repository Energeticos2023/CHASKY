<!DOCTYPE html>
<html lang="es-PE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CHASKI V3</title><meta name="theme-color" content="#07101d"><style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#f5f8fc;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding-bottom:74px}button,input{font:inherit}.w{max-width:920px;margin:auto;padding:0 14px}.top{position:sticky;top:0;z-index:9;background:#07101df2;border-bottom:1px solid #26384f;backdrop-filter:blur(12px)}.head{display:flex;align-items:center;gap:10px;padding:12px 0}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ffd166,#ef7600);font-size:22px}.ttl{font-weight:900;font-size:19px;letter-spacing:1px}.sub{font-size:11px;color:#8090a6}.search{display:flex;gap:7px;padding-bottom:10px}.search input{flex:1;border:0;border-radius:12px;padding:12px;background:white;color:#0b1625}.tabs{display:flex;gap:7px;overflow:auto;padding:12px 0 8px}.tab{border:1px solid #26384f;background:#111e30;color:#b9c6d8;border-radius:999px;padding:8px 13px;font-weight:800;white-space:nowrap}.tab.on{background:#ffb020;color:#211403;border-color:#ffb020}.count{font-size:12px;color:#8090a6;margin:3px 0 10px}.card{background:#111e30;border:1px solid #26384f;border-radius:16px;padding:14px;margin-bottom:12px}.title{font-weight:900;font-size:16px}.meta{font-size:12px;color:#b9c6d8;margin-top:4px}.badge{display:inline-block;margin:8px 5px 0 0;padding:4px 8px;border-radius:999px;background:#17273c;color:#b9c6d8;font-size:10.5px;font-weight:800}.badgeh{color:#35d39a;background:#113227}.badgep{color:#ffd166;background:#342611}.seace{margin-top:12px;padding:12px;background:#0a1422;border:1px solid #29405c;border-radius:12px}.seace h4{margin:0 0 8px;color:#ffd166;font-size:11px;text-transform:uppercase;letter-spacing:.7px}.f{display:grid;grid-template-columns:118px 1fr auto;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid #1f3045}.f:last-child{border-bottom:0}.k{color:#8090a6;font-size:10px;text-transform:uppercase}.v{font-size:12px;word-break:break-word}.cp{border:1px solid #315070;background:#102238;color:#69b7ff;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:900}.btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.primary,.secondary{border:0;border-radius:11px;padding:11px;font-weight:900}.primary{background:linear-gradient(135deg,#ffd166,#ef8b00);color:#241606}.secondary{background:#17273c;color:#dce9fa;border:1px solid #26384f}.private{border-left:4px solid #35d39a}.note{background:#111e30;border:1px solid #26384f;border-radius:14px;padding:13px;color:#b9c6d8;margin:11px 0}.empty{text-align:center;color:#8090a6;padding:38px 15px}.toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#eef6ff;color:#0e1a29;border-radius:10px;padding:9px 13px;opacity:0;transition:.2s;z-index:99;font-weight:800;font-size:12px}.toast.on{opacity:1}nav{position:fixed;left:0;right:0;bottom:0;background:#08111df7;border-top:1px solid #26384f;display:grid;grid-template-columns:repeat(3,1fr)}nav button{border:0;background:transparent;color:#8090a6;padding:10px 4px;font-weight:800}nav button.on{color:#ffd166}@media(max-width:520px){.f{grid-template-columns:92px 1fr auto}.btns{grid-template-columns:1fr}.ttl{font-size:17px}}
</style></head><body>
<div class="top"><div class="w"><div class="head"><div class="logo">⚡</div><div><div class="ttl">CHASKI V3</div><div class="sub">Copiar → pegar → buscar, con sector público y privado</div></div></div><div class="search"><input id="q" placeholder="Buscar entidad, empresa, proceso, CUI, rubro…"></div></div></div>
<main class="w"><div class="tabs"><button class="tab on" data-mode="public">🏛️ Públicas</button><button class="tab" data-mode="private">🏢 Privadas</button><button class="tab" data-mode="all">🌐 Todas</button></div><div id="count" class="count">Cargando…</div><div id="list"></div></main>
<nav><button class="on" onclick="setMode('public',this)">🏛️ Públicas</button><button onclick="setMode('private',this)">🏢 Privadas</button><button onclick="openSources()">🔎 Fuentes</button></nav><div id="toast" class="toast"></div>
<script>
var PUB={oportunidades:[]},PRI={oportunidades:[]},MODE='public',Q='';
var SEACE='https://prod2.seace.gob.pe/seacebus-uiwd-pub/buscadorPublico/buscadorPublico.xhtml';
function e(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}
function n(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function t(m){var x=document.getElementById('toast');x.textContent=m;x.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(function(){x.classList.remove('on')},1800)}
function cp(v,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v||'').then(function(){t(msg||'Copiado')})}else{var a=document.createElement('textarea');a.value=v||'';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);t(msg||'Copiado')}}
function fmt(s){if(!s)return '';var p=s.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
function objText(o){var of=o.oficial||{};return of.tipo==='Bien'?'BIEN':of.tipo==='Servicio'?'SERVICIO':of.tipo==='Consultoría'?'SERVICIO':'OBRA'}
function publicSearchFields(o){var of=o.oficial||{};var entidad=of.entidad||'';var objeto=objText(o);var desc=o.titulo||'';var desde=of.verificado?fmt(of.verificado):'';var hasta=of.cierra?fmt(of.cierra):'';return {entidad:entidad,objeto:objeto,desc:desc,desde:desde,hasta:hasta,nom:of.nomenclatura||'',cui:of.cui||''}}
function copyPack(o){var f=publicSearchFields(o);var txt='ENTIDAD: '+f.entidad+'\nOBJETO DE CONTRATACIÓN: '+f.objeto+'\nDESCRIPCIÓN DEL OBJETO: '+f.desc+'\nFECHA PUBLICACIÓN DESDE: '+f.desde+'\nFECHA PUBLICACIÓN HASTA: '+f.hasta+(f.nom?'\nNOMENCLATURA: '+f.nom:'')+(f.cui?'\nCUI: '+f.cui:'');cp(txt,'Datos SEACE copiados')}
function openSearch(o){var of=o.oficial||{};var q=(of.nomenclatura&&n(of.nomenclatura).indexOf('no publicada')<0)?'\"'+of.nomenclatura+'\"':'\"'+(o.titulo||'')+'\" \"'+(of.entidad||'')+'\"';window.open('https://www.google.com/search?q='+encodeURIComponent(q+' SEACE'),'_blank','noopener')}
function pf(k,v){return '<div class="f"><div class="k">'+e(k)+'</div><div class="v">'+e(v||'')+'</div><button class="cp" onclick="cp('+JSON.stringify(v||'')+',\'Copiado\')">COPIAR</button></div>'}
function pcard(o){var of=o.oficial||{},f=publicSearchFields(o);return '<article class="card"><div class="title">'+e(o.titulo)+'</div><div class="meta">'+e(of.entidad||'')+' · '+e((of.distrito?of.distrito+', ':'')+(of.provincia||''))+'</div><span class="badge badgep">PÚBLICA</span><span class="badge">'+e(of.tipo||'Proceso')+'</span>'+(of.cierra?'<span class="badge">Cierra '+e(fmt(of.cierra))+'</span>':'')+'<div class="seace"><h4>Datos listos para copiar en SEACE</h4>'+pf('Entidad',f.entidad)+pf('Objeto',f.objeto)+pf('Descripción',f.desc)+pf('Fecha desde',f.desde)+pf('Fecha hasta',f.hasta)+(f.nom?pf('Nomenclatura',f.nom):'')+(f.cui?pf('CUI',f.cui):'')+'</div><div class="btns"><button class="primary" onclick=\'copyPack('+JSON.stringify(o).replace(/'/g,"&#39;")+')\'>📋 COPIAR TODO PARA SEACE</button><button class="secondary" onclick=\'openSearch('+JSON.stringify(o).replace(/'/g,"&#39;")+')\'>🚀 ABRIR BÚSQUEDA</button></div></article>'}
function prcard(o){return '<article class="card private"><div class="title">'+e(o.titulo)+'</div><div class="meta">'+e(o.empresa||'')+' · '+e(o.sector||'')+' · '+e(o.region||'')+'</div><span class="badge badgeh">PRIVADA</span><span class="badge">'+e(o.tipo||'Oportunidad')+'</span><span class="badge">Prioridad '+e(o.prioridad||'')+'</span><div class="note"><b>Qué hacer:</b> '+e(o.accion||'')+'<br><br>'+e(o.resumen||'')+'</div><div class="seace"><h4>Datos rápidos</h4>'+pf('Empresa',o.empresa||'')+pf('Rubro',(o.rubros||[]).join(', '))+pf('Acción',o.accion||'')+'</div><div class="btns"><button class="primary" onclick="window.open('+JSON.stringify(o.url||o.url_info||'')+',\'_blank\',\'noopener\')">🚀 ABRIR PORTAL</button><button class="secondary" onclick="cp('+JSON.stringify((o.empresa||'')+' | '+(o.accion||''))+',\'Ficha copiada\')">📋 COPIAR ACCIÓN</button></div></article>'}
function matches(x){var s=n(JSON.stringify(x));return !Q||s.indexOf(n(Q))>=0}
function render(){var a=[];if(MODE==='public'||MODE==='all')a=a.concat((PUB.oportunidades||[]).filter(matches).map(function(o){return {k:'p',o:o}}));if(MODE==='private'||MODE==='all')a=a.concat((PRI.oportunidades||[]).filter(matches).map(function(o){return {k:'r',o:o}}));if(MODE!=='private')a=a.filter(function(x){return x.k==='r'||!x.o.oficial||!x.o.oficial.cierra||new Date(x.o.oficial.cierra+'T23:59:59')>=new Date()});a.sort(function(a,b){if(a.k!==b.k)return a.k==='p'?-1:1;if(a.k==='p')return String(a.o.oficial.cierra||'9999').localeCompare(String(b.o.oficial.cierra||'9999'));return (b.o.prioridad||0)-(a.o.prioridad||0)});document.getElementById('count').textContent=a.length+' oportunidades visibles';document.getElementById('list').innerHTML=a.length?a.map(function(x){return x.k==='p'?pcard(x.o):prcard(x.o)}).join(''):'<div class="empty">No hay resultados.</div>'}
function setMode(m,b){MODE=m;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.dataset.mode===m)});document.querySelectorAll('nav button').forEach(function(x){x.classList.remove('on')});if(b)b.classList.add('on');render()}
function openSources(){window.open(SEACE,'_blank','noopener');window.open('privadas.json','_blank','noopener')}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){setMode(this.dataset.mode)}});document.getElementById('q').oninput=function(){Q=this.value;render()};
Promise.all([fetch('oportunidades.json?v='+Date.now()).then(function(r){return r.json()}),fetch('privadas.json?v='+Date.now()).then(function(r){return r.json()})]).then(function(d){PUB=d[0];PRI=d[1];render()}).catch(function(){document.getElementById('count').textContent='No se pudieron cargar los datos';document.getElementById('list').innerHTML='<div class="empty">Revisa la conexión o vuelve a cargar.</div>'});
</script></body></html>
